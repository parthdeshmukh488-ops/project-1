name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,exact,plot]"

      - name: Run test suite
        run: pytest tests/ -q

  coverage:
    name: coverage and experiments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,exact,plot]"
          # The accuracy claims are measured against mpmath; the tests that
          # need it skip without it, which would silently remove the sharpest
          # checks in the suite.
          pip install mpmath

      # The suite is this project's main correctness claim, so the floor is
      # enforced rather than merely reported.
      - name: Coverage
        run: >
          pytest tests/ -q --cov=volsurf --cov-report=term-missing
          --cov-fail-under=95

      # Short end-to-end runs, so the figures in the README stay
      # reproducible rather than becoming stale artefacts.
      - name: Experiment pipelines smoke test
        run: |
          PYTHONPATH=experiments python experiments/precision.py --quick
          PYTHONPATH=experiments python experiments/round_trip.py --quick
